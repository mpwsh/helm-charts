name: Lint and Test Charts

on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # chart-testing installs yamllint/yamale into a venv on this interpreter. The yamale it pins
      # still uses ast.Num, which Python 3.14 removed, so stay on 3.12 until chart-testing moves.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/workflows/linters/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/workflows/linters/ct.yaml

      # Render every changed chart with its default values: catches templates that reference
      # values which do not exist (a nil-pointer at install time) without needing a cluster.
      - name: Render changed charts
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for chart in $(ct list-changed --config .github/workflows/linters/ct.yaml); do
            echo "== $chart"
            helm dependency build "$chart"
            helm template test "$chart" > /dev/null
          done

