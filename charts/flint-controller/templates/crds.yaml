{{- if .Values.crds.install -}}
# Generated by `flint controller --print-crds` (flint 0.1.7); regenerate when the
# types in crates/core/src/crd.rs change. Kept on uninstall so claims and rules, and the
# nodes and ports behind them, outlive the release.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: nodeclaims.flint.mpw.sh
spec:
  group: flint.mpw.sh
  names:
    categories: []
    kind: NodeClaim
    plural: nodeclaims
    shortNames:
    - nc
    singular: nodeclaim
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.node
      name: Node
      type: string
    - jsonPath: .status.ip
      name: IP
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for NodeClaimSpec via `CustomResource`
        properties:
          spec:
            description: A request for one node in a region.
            properties:
              labels:
                additionalProperties:
                  type: string
                description: Extra labels for the node, on top of the cluster defaults and the region label.
                type: object
              plan:
                description: Provider plan; the controller's default plan when unset.
                nullable: true
                type: string
              region:
                description: Provider region the node must be in (`scl`, `ewr`, …).
                type: string
            required:
            - region
            type: object
          status:
            description: What the controller did with a claim.
            nullable: true
            properties:
              ip:
                description: Public address once known.
                nullable: true
                type: string
              message:
                description: Human-readable progress or error.
                nullable: true
                type: string
              node:
                description: Node (and instance) name once created.
                nullable: true
                type: string
              observedGeneration:
                description: '`metadata.generation` the status describes.'
                format: int64
                nullable: true
                type: integer
              phase:
                default: Pending
                description: Where the claim is in its life.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Failed
                - Deleting
                type: string
              plan:
                description: Plan the node was created with.
                nullable: true
                type: string
              retryAfter:
                description: After a failure, when (RFC 3339) the controller will try again.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: NodeClaim
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: firewallrules.flint.mpw.sh
spec:
  group: flint.mpw.sh
  names:
    categories: []
    kind: FirewallRule
    plural: firewallrules
    shortNames:
    - fwr
    singular: firewallrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.protocol
      name: Protocol
      type: string
    - jsonPath: .spec.port
      name: Port
      type: string
    - jsonPath: .spec.cidr
      name: Source
      type: string
    - jsonPath: .status.applied
      name: Applied
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for FirewallRuleSpec via `CustomResource`
        properties:
          spec:
            description: A request to open a port on every node of the cluster.
            properties:
              cidr:
                default: 0.0.0.0/0
                description: Source network allowed in; everyone by default.
                type: string
              port:
                description: Port or inclusive range (`7777`, `27000-27100`).
                type: string
              protocol:
                default: tcp
                description: Transport protocol; TCP by default.
                enum:
                - tcp
                - udp
                type: string
            required:
            - port
            type: object
          status:
            description: Whether the rule is on the provider firewall.
            nullable: true
            properties:
              applied:
                default: false
                description: True once the provider firewall has the rule.
                type: boolean
              message:
                description: Why not, when not.
                nullable: true
                type: string
              observedGeneration:
                description: '`metadata.generation` the status describes.'
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: FirewallRule
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
