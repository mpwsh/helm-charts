apiVersion: v2
name: flint-controller
description: >-
  In-cluster controller for flint. A NodeClaim becomes a node in the region it names;
  a FirewallRule opens a port on the provider firewall. Apps ask for infrastructure with
  Kubernetes objects; only this controller holds the provider key.
type: application
version: "0.1.1"
appVersion: "0.2.0"
maintainers:
  - name: mpw
    email: x@mpw.sh
sources:
  - https://github.com/mpwsh/helm-charts/tree/main/charts/flint-controller
  - https://github.com/mpwsh/flint
keywords:
  - flint
  - k3s
  - vultr
  - nodes
  - firewall
