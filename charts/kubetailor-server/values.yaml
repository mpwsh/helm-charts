# Default values for kubetailor-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: kubetailor/server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# RBAC. Set both `create` flags to false when the ClusterRole, the `kubetailor` ServiceAccount and
# the `limited` ServiceAccount are applied from the kubetailor repository's deploy/ folder (as the
# flint overlay does); Helm cannot adopt resources it did not create.
clusterRole:
  create: true

serviceAccount:
  create: true
  # The ServiceAccount TailoredApp pods run as (config.kubetailor.deployment.serviceAccount).
  createLimited: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: kubetailor

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

environment:
  configPath: /app/config/conf.yaml

config:
  server:
    logLevel: debug
    addr: 0.0.0.0
    port: 8080
  quickwit:
    apiVersion: v1
    url: "http://quickwit-searcher.quickwit.svc:7280"
    index: otel-logs-v0_6
  kubetailor:
    namespace: kubetailor
    gitSync:
      image: registry.k8s.io/git-sync/git-sync:v3.6.6
      period: 30s
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
      # Limit connectivity to:
      # - internet
      # - pods owned by the same (owner) deployer
      # - pods on the same Group
      deployNetworkPolicies: true
      # Service account for tapps
      serviceAccount: limited
      # if false, services in the same namespace won't be listed in env vars.
      enableServiceLinks: false
      allowPrivilegeEscalation: false
      allowRoot: true
      architectures: ["amd64", "arm64"]
      allowedImages:
        - nginx
        - postgres
        - mkodockx/docker-pastebin
        - node
        - nicolaka/netshoot
        - tsl0922/ttyd:latest
      # Bounds on what one app may ask for, as Kubernetes quantities (the server refuses to
      # start on anything else). A minimum is also the default an app gets when it names no
      # size, so every pod carries requests and a full node is a known thing.
      resources:
        cpu:
          min: 200m
          max: 1
        memory:
          min: 128Mi
          max: 2Gi
        volume:
          count:
            max: 2
          size:
            min: 100Mi
            # Volumes live on the app's node (local-path); small so one app cannot fill it.
            max: 2Gi
      replicas:
        min: 1
        max: 3
    # Regions the console offers, by name (the id is the topology.kubernetes.io/region label
    # flint puts on nodes). Empty: whatever regions the nodes carry, named by their id.
    regions: []
    #  - id: scl
    #    name: Santiago
    #  - id: waw
    #    name: Warsaw
    ingress:
      # TailoredApps get `<shared>.<baseDomain>`.
      baseDomain: kubetailor.io
      # DNS target for apps that are not pinned to a region (external-dns `target`). Apps with
      # `region` or node-exposed ports get their node's public IP from the operator instead.
      loadBalancerEndpoint: lb.kubetailor.io
      # Ingress controller: class name plus the pod labels kubetailor's NetworkPolicy admits.
      className: traefik
      matchLabels:
        app.kubernetes.io/name: traefik
      # Added to every created Ingress. Controller-specific annotations go here
      # (e.g. nginx.ingress.kubernetes.io/* when className is nginx).
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
