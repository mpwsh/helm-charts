{{- /*
  The ClusterRole is shared with the operator (same name, same ServiceAccount), so its rules are
  the union both need. Keep in step with deploy/clusterrole.yaml in the kubetailor repository,
  or set clusterRole.create=false and apply that file instead.
*/ -}}
{{- if .Values.clusterRole.create }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kubetailor-server.serviceAccountName" . }}
rules:
- apiGroups:
  - kubetailor.io
  resources:
  - tailoredapps
  - tailoredapps/status
  verbs:
  - create
  - get
  - watch
  - list
  - patch
  - delete
  - update
  - deletecollection
# Placement: which node runs an app's pods and what that node's public IP is.
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - get
  - create
  - watch
  - list
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - watch
  - list
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - services
  - persistentvolumeclaims
  - persistentvolumes
  verbs:
  - get
  - watch
  - list
  - create
  - update
  - patch
  - delete
  - deletecollection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubetailor-server.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubetailor-server.serviceAccountName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "kubetailor-server.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
