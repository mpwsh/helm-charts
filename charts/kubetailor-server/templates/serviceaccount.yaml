{{- /*
  Both accounts are optional: on clusters where RBAC is managed outside the chart (flint's
  kubetailor overlay applies deploy/clusterrole.yaml and deploy/no-role-sa.yaml from the
  kubetailor repository) Helm must not try to adopt them.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubetailor-server.serviceAccountName" . }}
  labels:
    {{- include "kubetailor-server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.serviceAccount.createLimited }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "Must set service account to be used on kubetailor managed deployments" .Values.config.kubetailor.deployment.serviceAccount }}
  namespace: {{ required "Must set namespace to be used for kubetailor managed deployments" .Values.config.kubetailor.namespace }}
{{- end }}
