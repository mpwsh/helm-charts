{{- if .Values.clusterRole.create -}}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.clusterRole.name }}
rules:
- apiGroups:
  - kubetailor.io
  resources:
  - tailoredapps
  - tailoredapps/status
  verbs:
  - create
  - get
  - watch
  - list
  - patch
  - delete
  - update
  - deletecollection
# Placement: which node runs an app's pods and what that node's public IP is.
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
# Nodes and ports through the flint controller (flint.mpw.sh); unused, and harmless, on a
# cluster without it.
- apiGroups:
  - flint.mpw.sh
  resources:
  - nodeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - delete
- apiGroups:
  - flint.mpw.sh
  resources:
  - firewallrules
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - get
  - create
  - watch
  - list
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - watch
  - list
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - services
  - persistentvolumeclaims
  - persistentvolumes
  verbs:
  - get
  - watch
  - list
  - create
  - update
  - patch
  - delete
  - deletecollection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.clusterRole.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.clusterRole.name }}
subjects:
- kind: ServiceAccount
  name: {{ include "kubetailor-operator.serviceAccountName" . }}
  namespace: {{ include "kubetailor-operator.serviceAccountName" . }}
{{- end }}
