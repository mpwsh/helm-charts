{{- if .Values.rbac.create -}}
{{- $sa := include "flint-controller.serviceAccountName" . -}}
{{- $full := include "flint-controller.fullname" . -}}
# Cluster-wide: the two CRDs, and what adding or draining a node needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $full }}
  labels:
    {{- include "flint-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["flint.mpw.sh"]
    resources: ["nodeclaims", "firewallrules"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["flint.mpw.sh"]
    resources: ["nodeclaims/status", "firewallrules/status"]
    verbs: ["get", "update", "patch"]
  # Readiness checks, cordon (patch) and removal of drained nodes.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  # Draining: list a node's pods and evict them.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # The state store creates its namespace when missing.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $full }}
  labels:
    {{- include "flint-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $full }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# The cluster state Secret (flint-cluster-<cluster>) lives here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-state
  namespace: {{ include "flint-controller.stateNamespace" . }}
  labels:
    {{- include "flint-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-state
  namespace: {{ include "flint-controller.stateNamespace" . }}
  labels:
    {{- include "flint-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-state
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# Agents join with 30-minute bootstrap tokens: Secrets of type
# bootstrap.kubernetes.io/token, which only exist in kube-system. Create only; the
# tokens expire on their own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-bootstrap-tokens
  namespace: kube-system
  labels:
    {{- include "flint-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-bootstrap-tokens
  namespace: kube-system
  labels:
    {{- include "flint-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-bootstrap-tokens
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
